experiences:
  title: Relevant Experiences
  items:
    - title: LEANATIC GmbH
      description: >
        Custom web apps and PIM systems for SMEs in residental construction, civil engineering, and
        insurance.
      info:
        - Boutique Software Agency
        - Remote
        - Less than 10 employees
      items:
        - start: 2020-01-01
          end: 2024-10-31
          title: Cross-functional Tech & Product Lead
          summary: >
            Originally hired as a frontend developer, I gradually took ownership of critical
            delivery functions — product ownership, project coordination, DevOps, Tech Lead. I
            stepped up where structure was missing, creating clarity, stability, and momentum in an
            environment that often ran on intuition and urgency.
          points:
            - Defined and enforced project workflows that reduced delivery confusion and scope creep
            - Instituted DevOps practices that slashed setup times and standardized deployments
            - Transitioned the team to trunk-based development, cutting coordination overhead
            - Presented directly to clients, improving feedback loops and reducing post-delivery
              churn
            - Advocated for outcome-driven thinking in a task-based org, challenging the "just ship
              it" mindset

    - title: Phrase a.s.
      info:
        - Leading software translation platform with developer-focused USP.
      items:
        - start: 2017-04-01
          end: 2018-07-31
          location: Hamburg
          title: Technical Marketing & Customer Success Engineer
          summary: >
            Joined as a Customer Success Engineer for a developer-focused localization platform.
            Helped customers integrate our product - often coding solutions - and maintained the
            knowledge base. Ended as Technical Marketing Lead, optimizing the blog for SEO and
            performance.
          points:
            - Introduced workflow standards and doc practices that scaled with volume.
            - Reorganized the knowledge base around the key user roles I identified (dev,
              translator, manager). This model was later adopted by Marketing.
            - Reduced blog load times by 60% - contributing to higher SEO visibility.

