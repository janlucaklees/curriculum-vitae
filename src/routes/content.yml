skills:
  title: How I Create Leverage
  items:
    - title: Flow-Focused Leadership
      summary: >
        Faced with only 2 weeks for a project originally estimated at 3 months, I strategically
        managed tradeoffs and by obsessing over customer requirements and internal constraints, I
        identified the leanest viable implementation. By then restructuring team focus, shielding
        key contributors from interruptions, and running targeted standups, we delivered a working
        solution in just 3 days.

    - title: User-Centric Approach
      summary: >
        Facilitated deep collaboration with end users to co-design the product vision through weekly
        feedback loops and iterative prototyping. building trust along the way and turning a
        near-lost customer into a rollout success story.

    - title: Cross-Functional Enablement
      points:
        - Accelerated dev velocity by cutting project setup times from hours to minutes through a
          docker-based dev environment which then was adopted company-wide.
        - Increased user-facing release frequency from 1–2 per week to several times per day by
          implementing fully automated CI/CD pipelines across all projects.
        - Eliminated feature-blocking bottlenecks by introducing trunk-based development, reducing
          frustrations across the team and unlocking faster iteration and smoother delivery.

principles:
  title: Principles I Work By
  items:
    - ⮞ Clarity over certainty
    - ⮞ Systems beat heroics
    - ⮞ Feedback early, not just often
    - ⮞ Ship small, learn fast
    - ⮞ Collaboration starts with listening

